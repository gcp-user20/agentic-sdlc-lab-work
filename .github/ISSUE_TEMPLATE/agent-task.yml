name: Agent task contract
description: Define a scoped task for an AI agent
labels:
  - agent-task
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Describe the desired outcome.
    validations:
      required: true
  - type: textarea
    id: context-links
    attributes:
      label: Context links
      description: Add relevant links, issues, pull requests, or documentation.
  - type: input
    id: in-scope-paths
    attributes:
      label: In-scope paths
      description: List the paths the agent may change.
    validations:
      required: true
  - type: input
    id: out-of-scope
    attributes:
      label: Out of scope
      description: List paths or work that are excluded.
      value: alembic/, .github/, pyproject.toml, any new dependency
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Define the conditions that determine completion.
    validations:
      required: true
  - type: textarea
    id: stop-and-ask
    attributes:
      label: Stop and ask a human if
      description: Specify situations that require human intervention.
    validations:
      required: true
  - type: input
    id: reviewer
    attributes:
      label: Reviewer
      description: Name the person or team responsible for review.
